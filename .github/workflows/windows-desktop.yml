name: Windows Desktop Gateway
on:
  push:
    branches: [main, feature/local-presend-privacy-review-v0.4.1]
    paths:
      - "desktop-gateway/**"
      - ".github/workflows/windows-desktop.yml"
  pull_request:
    branches: [main]
    paths:
      - "desktop-gateway/**"
      - ".github/workflows/windows-desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run local privacy engine tests
        working-directory: desktop-gateway
        run: python -m unittest discover -s tests -v
      - name: Install packager
        run: python -m pip install --upgrade pip pyinstaller
      - name: Build standalone executable
        working-directory: desktop-gateway
        run: pyinstaller --noconfirm --clean --onefile --windowed --name XILAC-PuertaLocal main.py
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build Windows installer
        working-directory: desktop-gateway
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          iscc installer.iss
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: XILAC-PuertaLocal-Windows
          path: |
            desktop-gateway/dist/XILAC-PuertaLocal.exe
            desktop-gateway/dist/XILAC-PuertaLocal-Setup.exe
          if-no-files-found: error
          retention-days: 14
