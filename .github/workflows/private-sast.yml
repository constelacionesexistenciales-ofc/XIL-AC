name: Private SAST fallback

on:
  push:
    branches: [main, 'feat/**', 'feature/**', 'audit/**', 'security/**', 'fix/**']
  pull_request:
    branches: [main, 'feat/**', 'feature/**', 'audit/**', 'security/**', 'fix/**']
  workflow_dispatch:
  schedule:
    - cron: "30 6 * * 1"

permissions:
  contents: read

concurrency:
  group: private-sast-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep Python SAST
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: python -m pip install "semgrep==1.180.0"

      - name: Scan source
        run: |
          semgrep scan --config p/python --json --output semgrep-report.json --error .

      - name: Upload Semgrep report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: xilac-semgrep-report
          path: semgrep-report.json
          if-no-files-found: warn
          retention-days: 30

  container-image-security:
    name: Container image scan, SBOM, and runtime smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Build local image
        id: build
        run: docker build --pull -t xilac-ci:${GITHUB_SHA} .

      - name: Generate container SBOM (CycloneDX)
        if: always() && steps.build.outcome == 'success'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: v0.74.0
          scan-type: image
          image-ref: xilac-ci:${{ github.sha }}
          format: cyclonedx
          output: sbom-container.cdx.json
          scanners: vuln

      - name: Scan container image for HIGH/CRITICAL risks
        if: always() && steps.build.outcome == 'success'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: v0.74.0
          scan-type: image
          image-ref: xilac-ci:${{ github.sha }}
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          format: json
          output: trivy-image-report.json
          exit-code: "1"

      - name: Start container and verify health endpoint
        if: steps.build.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name xilac-ci-smoke -p 127.0.0.1:18000:8000 xilac-ci:${GITHUB_SHA}
          cleanup() {
            docker logs xilac-ci-smoke || true
            docker rm -f xilac-ci-smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18000/health/live >/dev/null; then
              echo "PASS: container started and /health/live responded."
              exit 0
            fi
            sleep 2
          done
          echo "Container health endpoint did not become ready."
          exit 1

      - name: Upload image report and SBOM
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: xilac-container-sbom-and-trivy
          path: |
            sbom-container.cdx.json
            trivy-image-report.json
          if-no-files-found: warn
          retention-days: 30

  trivy:
    name: Trivy filesystem security scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Scan dependencies, configuration and secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: v0.74.0
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          format: json
          output: trivy-report.json
          exit-code: "1"

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: xilac-trivy-report
          path: trivy-report.json
          if-no-files-found: warn
          retention-days: 30

  scanner-gate-self-test:
    name: Scanner gate self-test (synthetic findings)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: python -m pip install "semgrep==1.180.0"

      - name: Create isolated Semgrep test fixture and rule
        run: |
          mkdir -p "$RUNNER_TEMP/xilac-semgrep-self-test"
          cat > "$RUNNER_TEMP/xilac-semgrep-self-test/fixture.py" <<'PY'
          user_input = input("synthetic input: ")
          eval(user_input)
          PY
          cat > "$RUNNER_TEMP/xilac-semgrep-self-test/rule.yml" <<'YAML'
          rules:
            - id: xilac.self_test.eval
              languages: [python]
              severity: ERROR
              message: Synthetic self-test finding; never use eval on untrusted input.
              pattern: eval(...)
          YAML

      - name: Verify Semgrep exits nonzero on a controlled finding
        id: semgrep_self_test
        continue-on-error: true
        run: |
          semgrep scan --config "$RUNNER_TEMP/xilac-semgrep-self-test/rule.yml" --json --output "$RUNNER_TEMP/xilac-semgrep-self-test/report.json" --error "$RUNNER_TEMP/xilac-semgrep-self-test/fixture.py"

      - name: Assert Semgrep detected the fixture and activated the gate
        if: always()
        env:
          SCANNER_OUTCOME: ${{ steps.semgrep_self_test.outcome }}
        run: |
          python - <<'PY'
          import json, os, pathlib, sys
          report_path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "xilac-semgrep-self-test" / "report.json"
          if os.environ.get("SCANNER_OUTCOME") != "failure":
              sys.exit("Semgrep self-test did not fail on the controlled finding")
          if not report_path.is_file():
              sys.exit("Semgrep did not produce its JSON report")
          report = json.loads(report_path.read_text())
          findings = report.get("results", [])
          if not any("Synthetic self-test finding" in item.get("extra", {}).get("message", "") for item in findings):
              sys.exit("Semgrep failed without reporting the expected controlled finding")
          print("PASS: Semgrep reported the synthetic finding and returned a blocking exit status.")
          PY

      - name: Create isolated Trivy secret fixture
        run: |
          mkdir -p "$RUNNER_TEMP/xilac-trivy-self-test"
          printf '%s%s%s\\n' 'GITHUB_TOKEN=ghp_' '0123456789abcdef0123456789abcdef' '0123' > "$RUNNER_TEMP/xilac-trivy-self-test/synthetic.env"

      - name: Verify Trivy exits nonzero on a controlled synthetic secret
        id: trivy_self_test
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: v0.74.0
          scan-type: fs
          scan-ref: ${{ runner.temp }}/xilac-trivy-self-test
          scanners: secret
          severity: HIGH,CRITICAL
          format: json
          output: trivy-self-test-report.json
          exit-code: "1"

      - name: Assert Trivy detected the synthetic secret and activated the gate
        if: always()
        env:
          SCANNER_OUTCOME: ${{ steps.trivy_self_test.outcome }}
        run: |
          python - <<'PY'
          import json, os, pathlib, sys
          report_path = pathlib.Path("trivy-self-test-report.json")
          if os.environ.get("SCANNER_OUTCOME") != "failure":
              sys.exit("Trivy self-test did not fail on the controlled synthetic secret")
          if not report_path.is_file():
              sys.exit("Trivy did not produce its JSON report")
          report = json.loads(report_path.read_text())
          findings = [secret for result in report.get("Results", []) for secret in result.get("Secrets", [])]
          if not findings:
              sys.exit("Trivy failed without reporting the expected controlled secret")
          print("PASS: Trivy reported the synthetic secret and returned a blocking exit status.")
          PY
