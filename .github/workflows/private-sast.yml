name: Private SAST fallback

on:
  push:
    branches: [main, 'feat/**', 'feature/**', 'audit/**']
  pull_request:
    branches: [main, 'feat/**', 'feature/**', 'audit/**']
  workflow_dispatch:
  schedule:
    - cron: "30 6 * * 1"

permissions:
  contents: read

concurrency:
  group: private-sast-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep Python SAST
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: python -m pip install "semgrep==1.180.0"

      - name: Scan source
        run: |
          semgrep scan --config p/python --json --output semgrep-report.json --error .

      - name: Verify Semgrep engine with controlled fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/xilac-semgrep-control"
          cat > "$RUNNER_TEMP/xilac-semgrep-control/unsafe_fixture.py" <<'PY'
          import subprocess

          subprocess.call("echo controlled-semgrep-test", shell=True)
          PY
          cat > "$RUNNER_TEMP/xilac-semgrep-control/rule.yml" <<'YAML'
          rules:
            - id: xilac-controlled-shell-true
              languages: [python]
              severity: ERROR
              message: Controlled fixture must be detected by the Semgrep engine.
              pattern: subprocess.call(..., shell=True)
          YAML
          semgrep scan \
            --config "$RUNNER_TEMP/xilac-semgrep-control/rule.yml" \
            --json \
            --output "$RUNNER_TEMP/xilac-semgrep-control/report.json" \
            "$RUNNER_TEMP/xilac-semgrep-control/unsafe_fixture.py"
          python - "$RUNNER_TEMP/xilac-semgrep-control/report.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as report_file:
              report = json.load(report_file)
          if report.get("errors") or not report.get("results"):
              raise SystemExit("Semgrep controlled detection self-test failed")
          print("Semgrep controlled detection self-test passed")
          PY

      - name: Upload Semgrep report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: xilac-semgrep-report
          path: semgrep-report.json
          if-no-files-found: warn
          retention-days: 30

  trivy:
    name: Trivy filesystem security scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Scan dependencies, configuration and secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: v0.74.0
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          format: json
          output: trivy-report.json
          exit-code: "1"

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: xilac-trivy-report
          path: trivy-report.json
          if-no-files-found: warn
          retention-days: 30
