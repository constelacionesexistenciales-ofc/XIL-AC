name: CI
on:
  push:
    branches: [main, 'feat/**', 'feature/**', 'audit/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: xilac_test
          POSTGRES_USER: xilac_test
          POSTGRES_PASSWORD: xilac_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xilac_test -d xilac_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://xilac_test:xilac_test@localhost:5432/xilac_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Validate local Compose configuration
        run: POSTGRES_DB=xilac POSTGRES_USER=xilac POSTGRES_PASSWORD=local-test-password XILAC_API_TOKEN=local-test-token docker compose config --quiet
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[test]"
      - run: ruff check core tests scripts
      - run: pytest
