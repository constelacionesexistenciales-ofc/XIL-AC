name: CodeQL
on:
  push:
    branches: [main, 'feat/**', 'feature/**', 'audit/**']
  pull_request:
    branches: [main, feat/universal-research-experience, feat/owned-research-engine-evaluation]
  schedule:
    - cron: "23 5 * * 1"
permissions:
  actions: read
  contents: read
  security-events: write
concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  analyze:
    if: github.event.repository.private == false
    name: Analyze Python
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python
      # Repository default setup is enabled; avoid uploading a duplicate advanced-config SARIF.
      # Default setup remains responsible for publishing code-scanning results.
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          upload: false
