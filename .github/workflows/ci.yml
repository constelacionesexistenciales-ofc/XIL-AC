name: CI
on:
  push:
    branches: [main, 'feat/**', 'feature/**', 'audit/**']
  pull_request:
    branches: [main, 'feat/**', 'feature/**', 'audit/**']
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: xilac_test
          POSTGRES_USER: xilac_test
          POSTGRES_PASSWORD: xilac_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xilac_test -d xilac_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://xilac_test:xilac_test@localhost:5432/xilac_test
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
      - name: Validate local Compose configuration
        run: POSTGRES_DB=xilac POSTGRES_USER=xilac POSTGRES_PASSWORD=local-test-password XILAC_API_TOKEN=local-test-token docker compose config --quiet
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[test]"
      - name: Generate Python environment SBOM
        run: |
          pip install "cyclonedx-bom>=4,<8" "pip-audit>=2.7,<3"
          cyclonedx-py environment --output-format JSON --output-file sbom-python-environment.json
      - name: Audit installed Python dependencies
        run: |
          pip-audit --format json --output pip-audit-report.json || echo "DEPENDENCY_AUDIT_FAILED=true" >> "$GITHUB_ENV"
      - name: Static security scan (Bandit)
        run: |
          pip install "bandit>=1.7,<2.0"
          bandit -q -r core -ll
      - run: ruff check core tests scripts
      - name: Run unit and integration tests (browser suite runs in its dedicated workflow)
        run: pytest --ignore=tests/browser
      - name: Upload SBOM and dependency audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: xilac-sbom-and-dependency-audit
          path: |
            sbom-python-environment.json
            pip-audit-report.json
          if-no-files-found: warn
          retention-days: 30
      - name: Enforce dependency audit gate
        if: always()
        run: |
          if [ "${DEPENDENCY_AUDIT_FAILED:-false}" = "true" ]; then
            echo "Dependency audit failed or reported known vulnerabilities. Review pip-audit-report.json."
            exit 1
          fi
