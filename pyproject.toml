[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xil-ac"
version = "0.2.0"
description = "Núcleo seguro y auditable para XIL-AC"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1.0", "uvicorn[standard]>=0.30,<1.0", "psycopg[binary,pool]>=3.2,<4.0"]

[project.optional-dependencies]
test = ["pytest>=8,<9", "httpx>=0.27,<1.0", "ruff>=0.6,<1.0"]

[tool.setuptools.packages.find]
include = ["core*", "scripts*"]
exclude = ["tests*", "migrations*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F"]
