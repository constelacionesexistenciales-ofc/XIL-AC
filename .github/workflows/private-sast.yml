name: Private SAST fallback

on:
  push:
    branches: [main, 'feat/**', 'feature/**', 'audit/**']
  pull_request:
    branches: [main, 'feat/**', 'feature/**', 'audit/**']
  workflow_dispatch:
  schedule:
    - cron: "30 6 * * 1"

permissions:
  contents: read

concurrency:
  group: private-sast-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep Python SAST
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: python -m pip install "semgrep>=1.100,<2"

      - name: Scan source
        run: |
          semgrep scan --config p/python --json --output semgrep-report.json --error .

      - name: Upload Semgrep report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xilac-semgrep-report
          path: semgrep-report.json
          if-no-files-found: warn
          retention-days: 30

  trivy:
    name: Trivy filesystem security scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Scan dependencies, configuration and secrets
        uses: aquasecurity/trivy-action@v0.33.1
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          format: json
          output: trivy-report.json
          exit-code: "1"

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xilac-trivy-report
          path: trivy-report.json
          if-no-files-found: warn
          retention-days: 30
