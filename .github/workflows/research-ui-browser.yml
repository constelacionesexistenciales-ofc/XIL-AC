name: Research UI browser tests

on:
  push:
    branches: [integration/research-ui-browser-rebased]
    paths:
      - "frontend/universal-research/**"
      - "frontend/session-movement/**"
      - "tests/browser/**"
      - ".github/workflows/research-ui-browser.yml"
  pull_request:
    branches: [main]
    paths:
      - "frontend/universal-research/**"
      - "frontend/session-movement/**"
      - "tests/browser/**"
      - ".github/workflows/research-ui-browser.yml"

permissions:
  contents: read

concurrency:
  group: research-ui-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install browser test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest playwright
          python -m playwright install --with-deps chromium
      - name: Start static research UI
        run: |
          python -m http.server 4173 --directory frontend/universal-research > /tmp/research-ui.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/research-ui.log
          exit 1
      - name: Start static session movement UI
        run: |
          python -m http.server 4174 --directory frontend/session-movement > /tmp/session-movement-ui.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4174/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/session-movement-ui.log
          exit 1
      - name: Run browser tests
        run: pytest tests/browser -q
